name: Deploy Frontend to CloudPanel

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '161.97.133.74' }}
          username: ${{ secrets.SSH_USER || 'acco-fe-ssh' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # ১. NVM ও Node.js লোড বা অটো-ইনস্টল করা
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              if [ -s "/home/acco1122/.nvm/nvm.sh" ]; then
                export NVM_DIR="/home/acco1122/.nvm"
              else
                echo "NVM not found. Automatically installing NVM..."
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
                export NVM_DIR="$HOME/.nvm"
              fi
            fi

            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # যদি Node না থাকে, Node.js 20 ইনস্টল করা
            if ! command -v node &> /dev/null; then
              echo "Node.js not detected. Installing Node.js 20 LTS via NVM..."
              nvm install 20
              nvm use 20
              nvm alias default 20
            fi

            # পাথ নিশ্চিত করা
            CURRENT_NODE_VERSION="$(nvm current 2>/dev/null || echo '')"
            if [ -n "$CURRENT_NODE_VERSION" ] && [ -d "$NVM_DIR/versions/node/$CURRENT_NODE_VERSION/bin" ]; then
              export PATH="$NVM_DIR/versions/node/$CURRENT_NODE_VERSION/bin:$PATH"
            fi
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"

            # গিট সেফ ডিরেক্টরি পারমিশন নিশ্চিত করা
            git config --global --add safe.directory '*'

            # ২. প্রজেক্ট ডিরেক্টরিতে যাওয়া (CloudPanel htdocs)
            if [ -d "/home/acco1122/htdocs/acco.ink" ]; then
              cd "/home/acco1122/htdocs/acco.ink"
            elif [ -d "$HOME/htdocs/acco.ink" ]; then
              cd "$HOME/htdocs/acco.ink"
            else
              echo "Target directory for acco.ink not found!"
              exit 1
            fi
            echo "Target project directory: $(pwd)"

            # ৩. গিট রিপোজিটরি সেটআপ / সিঙ্ক
            if [ ! -d ".git" ]; then
              echo "Repository not initialized in site directory. Initializing..."
              rm -rf index.html default.html
              git init
              git remote add origin https://github.com/Rakibul599/imigration-frontend.git
              git fetch origin main
              git checkout -f -B main origin/main
            else
              git remote set-url origin https://github.com/Rakibul599/imigration-frontend.git || true
              git restore . || true
              git fetch origin main
              git reset --hard origin/main
            fi

            # ৪. প্রোডাকশন এনভায়রনমেন্ট ভ্যারিয়েবল সেট করা (Backend API & Face AI API URL)
            echo "NEXT_PUBLIC_BACKEND_API_URL=https://api.acco.ink/api" > .env.production
            echo "NEXT_PUBLIC_FACE_API_URL=${{ secrets.NEXT_PUBLIC_FACE_API_URL || 'https://face.acco.ink' }}" >> .env.production

            echo "NEXT_PUBLIC_BACKEND_API_URL=https://api.acco.ink/api" > .env.local
            echo "NEXT_PUBLIC_FACE_API_URL=${{ secrets.NEXT_PUBLIC_FACE_API_URL || 'https://face.acco.ink' }}" >> .env.local

            # ৫. ডিপেন্ডেন্সি ইন্সটল করা
            npm install --legacy-peer-deps --prefer-offline --no-audit

            # ৬. Next.js অ্যাপ্লিকেশন প্রোডাকশন বিল্ড
            npm run build

            # ৭. PM2 পাথ ডিটেকশন ও পরিষ্কার রিস্টার্ট
            export PM2_BIN="$(command -v pm2 || echo '')"
            if [ -z "$PM2_BIN" ] && [ -f "./node_modules/.bin/pm2" ]; then
              PM2_BIN="./node_modules/.bin/pm2"
            fi
            if [ -z "$PM2_BIN" ]; then
              PM2_BIN="npx pm2"
            fi

            echo "Using PM2: $PM2_BIN"

            # PM2 ডেমন আপডেট করা (ভার্সন মিসম্যাচ ওয়ার্নিং ফিক্স)
            $PM2_BIN update 2>/dev/null || true

            # পুরনো প্রসেস সরানো
            $PM2_BIN delete acco-frontend 2>/dev/null || true

            # পোর্ট ৩০০০ এ কোনো পুরনো হ্যাং প্রসেস থাকলে তা সরানো
            fuser -k 3000/tcp 2>/dev/null || true
            PID_3000=$(lsof -ti:3000 2>/dev/null || true)
            if [ -n "$PID_3000" ]; then
              kill -9 $PID_3000 2>/dev/null || true
            fi
            sleep 1

            # সম্পূর্ণ ফ্রেশ শুরু ecosystem.config.js দিয়ে
            $PM2_BIN start ecosystem.config.js --update-env

            $PM2_BIN save || true

            # ওয়ার্মআপ
            sleep 3

            # ডায়াগনস্টিক রিপোর্ট তৈরি করা (ব্রাউজার ও কার্ল থেকে ভেরিফাই করার জন্য)
            mkdir -p public
            {
              echo "=== 1. CURRENT USER & DIR ==="
              whoami
              pwd
              echo "=== 2. DIRECTORIES CHECK ==="
              ls -la /home/acco-fe-ssh/htdocs/ 2>/dev/null || echo "No /home/acco-fe-ssh/htdocs"
              ls -la /home/acco1122/htdocs/ 2>/dev/null || echo "No /home/acco1122/htdocs"
              echo "=== 3. NGINX VHOST CONFIG FOR ACCO.INK ==="
              grep -rn "proxy_pass" /etc/nginx/sites-enabled/ 2>/dev/null || grep -rn "proxy_pass" /etc/nginx/conf.d/ 2>/dev/null || true
              cat /etc/nginx/sites-enabled/*acco* 2>/dev/null || cat /etc/nginx/conf.d/*acco* 2>/dev/null || true
              echo "=== 4. LISTENING PORTS ==="
              ss -tlpn 2>/dev/null || netstat -tlpn 2>/dev/null || true
              echo "=== 5. RUNNING PROCESSES ==="
              ps aux | grep -E "node|next|pm2" | grep -v grep || true
              echo "=== 6. PM2 LIST & LOGS ==="
              $PM2_BIN list
              $PM2_BIN logs acco-frontend --lines 20 --nostream || true
              echo "=== 7. LOCAL RESPONSES ==="
              echo "--- Port 3000 ---"
              curl -sI http://127.0.0.1:3000 || true
              curl -s http://127.0.0.1:3000 | grep -o '"buildId":"[^"]*"' || true
              echo "--- Port 3001 ---"
              curl -sI http://127.0.0.1:3001 || true
            } > public/debug_report.txt 2>&1 || true
            cp public/debug_report.txt /home/acco1122/htdocs/acco.ink/public/debug_report.txt 2>/dev/null || true
            cp public/debug_report.txt "$HOME/htdocs/acco.ink/public/debug_report.txt" 2>/dev/null || true

            echo "Frontend successfully deployed and running on acco.ink!"
