<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Back Document shadow layer -->
  <rect x="58" y="16" width="94" height="124" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Main Certificate / Registration Document -->
  <rect x="46" y="24" width="96" height="122" rx="8" fill="url(#docGrad)" stroke="#1e293b" stroke-width="3" filter="url(#docShadow)"/>

  <!-- Top Security Guilloche / Border header -->
  <rect x="56" y="34" width="76" height="6" rx="2" fill="#0284c7" fill-opacity="0.2"/>
  <circle cx="94" cy="48" r="8" fill="#0369a1"/>
  <path d="M94 43 L96 47 L100 48 L97 50 L98 54 L94 52 L90 54 L91 50 L88 48 L92 47 Z" fill="#fbbf24"/>

  <!-- Document Title & Text Lines -->
  <rect x="66" y="62" width="56" height="4" rx="2" fill="#0f172a"/>
  <rect x="56" y="73" width="76" height="2.5" rx="1.2" fill="#64748b"/>
  <rect x="56" y="80" width="68" height="2.5" rx="1.2" fill="#64748b"/>
  <rect x="56" y="87" width="72" height="2.5" rx="1.2" fill="#64748b"/>
  <rect x="56" y="94" width="48" height="2.5" rx="1.2" fill="#64748b"/>

  <!-- Official Gold & Red Wax Seal with Ribbon -->
  <g transform="translate(100, 104)">
    <!-- Ribbon tails -->
    <path d="M12 18 L6 36 L16 32 L26 36 L20 18 Z" fill="#dc2626"/>
    <path d="M22 18 L28 36 L36 32 L44 36 L38 18 Z" fill="#b91c1c"/>
    
    <!-- Outer Seal Ring -->
    <circle cx="22" cy="14" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <circle cx="22" cy="14" r="12" fill="#fbbf24"/>
    
    <!-- Verified Check inside Seal -->
    <path d="M16 14 L20 18 L28 10" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
