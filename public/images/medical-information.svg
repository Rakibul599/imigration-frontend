<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="medShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#047857" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Medical Cross / Shield Base -->
  <path d="M100 20 C125 20 155 24 155 58 C155 102 108 132 100 138 C92 132 45 102 45 58 C45 24 75 20 100 20 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3" filter="url(#medShadow)"/>
  
  <!-- Inner Colored Shield -->
  <path d="M100 27 C120 27 146 30 146 59 C146 96 106 123 100 128 C94 123 54 96 54 59 C54 30 80 27 100 27 Z" fill="#ecfdf5"/>

  <!-- Red & Green Medical Cross -->
  <rect x="91" y="46" width="18" height="42" rx="4" fill="#10b981"/>
  <rect x="79" y="58" width="42" height="18" rx="4" fill="#10b981"/>
  
  <rect x="94" y="49" width="12" height="36" rx="2" fill="#ef4444"/>
  <rect x="82" y="61" width="36" height="12" rx="2" fill="#ef4444"/>

  <!-- Stethoscope overlay -->
  <path d="M72 48 C72 38 82 35 90 35" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <path d="M128 48 C128 38 118 35 110 35" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  
  <path d="M72 48 V65 C72 82 86 94 100 94 C114 94 128 82 128 65 V48" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 94 V108" stroke="#0369a1" stroke-width="3"/>
  <circle cx="100" cy="112" r="7" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
  <circle cx="100" cy="112" r="3" fill="#ffffff"/>

  <!-- Heartbeat ECG Pulse Wave Badge -->
  <g transform="translate(68, 86)">
    <rect x="0" y="0" width="64" height="20" rx="10" fill="#0f172a" fill-opacity="0.85"/>
    <path d="M8 10 L20 10 L25 4 L30 16 L36 7 L40 12 L44 10 L56 10" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
