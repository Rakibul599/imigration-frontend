<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="docBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <linearGradient id="downloadCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background document offset layer -->
  <rect x="58" y="16" width="94" height="124" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>

  <!-- Main Document Container -->
  <rect x="46" y="24" width="98" height="122" rx="10" fill="url(#docBgGrad)" stroke="#1e3a8a" stroke-width="2.5" filter="url(#docShadow)"/>

  <!-- Official Top Header Banner -->
  <path d="M47 34 C47 28.5 51.5 24 57 24 L133 24 C138.5 24 143 28.5 143 34 L143 46 L47 46 Z" fill="url(#headerGrad)"/>
  
  <!-- Header Government Emblems/Accents -->
  <circle cx="62" cy="35" r="4" fill="#fbbf24"/>
  <rect x="72" y="32" width="46" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="72" y="38" width="28" height="2" rx="1" fill="#93c5fd"/>

  <!-- Document Content Placeholders -->
  <rect x="58" y="56" width="42" height="4" rx="2" fill="#1e293b"/>
  <rect x="58" y="66" width="74" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="58" y="74" width="62" height="3" rx="1.5" fill="#cbd5e1"/>
  <rect x="58" y="82" width="50" height="3" rx="1.5" fill="#cbd5e1"/>

  <!-- Document Barcode Lines -->
  <rect x="58" y="93" width="2" height="10" fill="#64748b"/>
  <rect x="62" y="93" width="4" height="10" fill="#64748b"/>
  <rect x="68" y="93" width="1" height="10" fill="#64748b"/>
  <rect x="71" y="93" width="3" height="10" fill="#64748b"/>
  <rect x="76" y="93" width="2" height="10" fill="#64748b"/>
  <rect x="80" y="93" width="5" height="10" fill="#64748b"/>
  <rect x="87" y="93" width="2" height="10" fill="#64748b"/>

  <!-- Circular Download Badge in Lower Right -->
  <g transform="translate(108, 92)" filter="url(#badgeShadow)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="20" cy="20" r="18" fill="url(#downloadCircleGrad)"/>
    
    <!-- Download Arrow Icon -->
    <path d="M20 11 L20 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 19 L20 25 L26 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 28 L27 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
