<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="payShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Back Card (Cyan/Blue) -->
  <g transform="translate(18, 16) rotate(-8)">
    <rect x="20" y="24" width="112" height="70" rx="8" fill="url(#cardBack)" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="20" y="38" width="112" height="14" fill="#0c4a6e"/>
  </g>

  <!-- Front Card (Dark Navy / Black) -->
  <rect x="38" y="44" width="124" height="78" rx="10" fill="url(#cardFront)" stroke="#334155" stroke-width="2.5" filter="url(#payShadow)"/>

  <!-- EMV Gold Chip -->
  <rect x="52" y="60" width="22" height="18" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <line x1="52" y1="69" x2="74" y2="69" stroke="#b45309" stroke-width="1"/>
  <line x1="63" y1="60" x2="63" y2="78" stroke="#b45309" stroke-width="1"/>

  <!-- Contactless Payment Wave -->
  <path d="M82 65 A8 8 0 0 1 82 73" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M86 62 A13 13 0 0 1 86 76" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M90 59 A18 18 0 0 1 90 79" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Cardholder / Numbers -->
  <rect x="52" y="88" width="58" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="52" y="96" width="38" height="2.5" rx="1.2" fill="#64748b"/>

  <!-- Currency Ringgit Malaysia "RM" Badge (Bottom Right) -->
  <g transform="translate(132, 94)">
    <circle cx="16" cy="16" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5"/>
    <text x="16" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#0f172a">RM</text>
  </g>
</svg>
