<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="workShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0c4a6e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Industrial Cog / Gear in background -->
  <g transform="translate(138, 52)" fill="#94a3b8" opacity="0.6">
    <path d="M-6 -26 H6 L8 -20 L14 -18 L19 -23 L27 -15 L22 -10 L24 -4 L30 -2 V10 L24 12 L22 18 L27 23 L19 31 L14 26 L8 28 L6 34 H-6 L-8 28 L-14 26 L-19 31 L-27 23 L-22 18 L-24 12 L-30 10 V-2 L-24 -4 L-22 -10 L-27 -15 L-19 -23 L-14 -18 L-8 -20 Z"/>
    <circle cx="0" cy="4" r="12" fill="#ffffff"/>
  </g>

  <!-- Professional Briefcase / Work Case -->
  <!-- Handle -->
  <path d="M78 40 V30 C78 26 84 22 92 22 H108 C116 22 122 26 122 30 V40" stroke="#1e293b" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Main Case Body -->
  <rect x="44" y="38" width="112" height="84" rx="10" fill="url(#caseGrad)" stroke="#1e293b" stroke-width="3.5" filter="url(#workShadow)"/>

  <!-- Flap / Middle Division -->
  <path d="M44 58 L90 74 C96 76 104 76 110 74 L156 58" stroke="#1e293b" stroke-width="3" fill="#0369a1"/>

  <!-- Golden Locks -->
  <rect x="66" y="70" width="10" height="14" rx="2" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  <rect x="124" y="70" width="10" height="14" rx="2" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>

  <!-- Center Official Government Worker Pass Badge -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Malaysian Star & Crescent Silhouette -->
    <path d="M-5 -6 C-1 -6 3 -3 3 1 C3 5 -1 8 -5 8 C-2 7 0 4 0 1 C0 -2 -2 -5 -5 -6 Z" fill="#f59e0b"/>
    <polygon points="2, -2 4, 1 7, 1 5, 3 6, 6 3, 4 1, 6 2, 3 0, 1 3, 1" fill="#f59e0b"/>
  </g>

  <!-- Corner Protectors -->
  <path d="M44 110 V122 H56" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <path d="M156 110 V122 H144" stroke="#f59e0b" stroke-width="3" fill="none"/>
</svg>
